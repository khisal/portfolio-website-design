name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish only what the pages load. Uploading the repo root would also
      # serve project/uploads/ (drafts, source JSX, Profile.pdf), README.md and
      # the workflow itself at public URLs.
      - name: Stage site files
        run: |
          mkdir _site
          cp -r index.html alivyo.html support.js image-slot.js .image-slots.state.json .nojekyll assets vendor _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
